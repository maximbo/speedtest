[project]
name = "speedtest"
version = "0.1.0"
description = "Консольная утилита для последовательного замера скорости скачивания по HTTP/HTTPS"
readme = "README.md"
authors = [{ name = "Maxim Bodyansky", email = "bodyansky@gmail.com" }]
requires-python = ">=3.14"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "Topic :: System :: Networking",
]
dependencies = ["httpx[http2,socks]>=0.28.1"]

[project.scripts]
speedtest = "speedtest:main"

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
